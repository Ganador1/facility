# Publishes the service images to GHCR so a self-hoster does not have to build
# them. Every image here is already built on each pull request by ci.yml's
# self-host-build job; this workflow only tags and pushes what that job proves.
#
# A version tag publishes `:<version>` and `:sha-<short>`. A manual run
# publishes only the sha tag, which is what you want when deploying an instance
# from a commit that is not a release.
#
# ECS can pull these anonymously only once the packages are public, which
# follows the repository's own visibility. While the repository is private,
# deployments keep building into their own registry — see the AWS runbook.
# Actions are pinned to full SHAs (guards/actions-pinned.mjs enforces it).
name: images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # api carries the worker and the migrate task as well: same bits, a
          # different command. It is aliased rather than rebuilt, below.
          - image: api
            dockerfile: Dockerfile
            target: api
            context: .
          - image: gateway
            dockerfile: Dockerfile
            target: gateway
            context: .
          - image: mcp
            dockerfile: Dockerfile
            target: mcp
            context: .
          - image: web
            dockerfile: apps/web/Dockerfile
            target: web
            context: .
          - image: runner
            dockerfile: runner/Dockerfile
            target: ""
            context: runner
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Resolve the tags to publish
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          sha_tag="sha-$(git rev-parse --short HEAD)"
          tags="${REGISTRY}/${{ matrix.image }}:${sha_tag}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            tags="${tags},${REGISTRY}/${{ matrix.image }}:${version}"
          fi
          echo "list=$tags" >> "$GITHUB_OUTPUT"
          echo "Publishing: $tags"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only, matching the module's default task_cpu_architecture.
      # Graviton deployments still build their own until arm64 is added here.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  alias-worker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The worker is the api image with another command. Aliasing the manifest
      # keeps the two digests identical: a worker can never drift from the api
      # it was released with.
      - name: Point worker at the api manifest
        shell: bash
        run: |
          set -euo pipefail
          alias_tag() {
            docker buildx imagetools create --tag "${REGISTRY}/worker:$1" "${REGISTRY}/api:$1"
          }
          alias_tag "sha-$(git rev-parse --short HEAD)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            alias_tag "${GITHUB_REF_NAME#v}"
          fi

# CI for capataz itself: the test suite (which runs the real CLI against
# temp repos) and this repo's own guards. Actions pinned to full SHAs — the
# same rule we generate for everyone (guards/actions-pinned.mjs enforces it
# here too).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Tests (CLI end to end against temp repos)
        run: npm test

      - name: Guards (dogfood)
        run: node guards/run.mjs
